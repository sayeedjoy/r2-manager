# Local development dependencies. The app itself runs on the host with
# `pnpm dev` (hot reload); this provides Postgres and SeaweedFS, an
# S3-compatible stand-in for R2. See docs/local-development.md.
#
# SeaweedFS rather than MinIO: MinIO stopped publishing community images, so
# minio/minio and minio/mc can no longer be pulled.
name: r2-manager

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: r2manager
      POSTGRES_PASSWORD: r2manager
      POSTGRES_DB: r2manager
    ports:
      # 5433 on the host so it doesn't collide with a locally installed Postgres on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2manager -d r2manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${S3_PORT:-8333}:8333" # S3 API (R2_ENDPOINT)
      - "${FILER_PORT:-8888}:8888" # filer web UI for browsing stored objects
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 first, which S3 doesn't bind.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the dev bucket, then exits. Safe to rerun.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - echo "s3.bucket.create -name r2-manager-dev" | weed shell -master=seaweedfs:9333
    restart: "no"

volumes:
  postgres-data:
  seaweedfs-data:
