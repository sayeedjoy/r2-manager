# Local development dependencies. The app itself runs on the host with
# `pnpm dev` (hot reload); this provides Postgres and MinIO, an
# S3-compatible stand-in for R2. See docs/local-development.md.
name: r2-manager

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: r2manager
      POSTGRES_PASSWORD: r2manager
      POSTGRES_DB: r2manager
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2manager -d r2manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: r2manager
      MINIO_ROOT_PASSWORD: r2manager-secret
      # The app signs requests for region "auto", as R2 expects.
      MINIO_SITE_REGION: auto
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the dev bucket, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 r2manager r2manager-secret &&
        mc mb --ignore-existing local/r2-manager-dev
    restart: "no"

volumes:
  postgres-data:
  minio-data:
